<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Golden Dan — Infrastructure, Networking, AI, Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.52" stop-color="#0a0d10"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#f5c451" stop-opacity=".20"/>
      <stop offset=".46" stop-color="#c9942e" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c641d"/>
      <stop offset=".24" stop-color="#ffd76a"/>
      <stop offset=".52" stop-color="#fff0a3"/>
      <stop offset=".75" stop-color="#e2ac38"/>
      <stop offset="1" stop-color="#7d5717"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#d5a53c" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#d5a53c" stroke-opacity=".32"/>

  <g opacity=".28" stroke="#d5a53c" fill="none">
    <path d="M-80 278 C170 110 318 116 470 211 S789 302 1285 80"/>
    <path d="M-120 244 C148 92 330 84 509 184 S851 298 1304 42" stroke-opacity=".55"/>
    <circle cx="82" cy="242" r="4" fill="#ffd76a"/>
    <circle cx="278" cy="113" r="3" fill="#ffd76a"/>
    <circle cx="938" cy="207" r="3" fill="#ffd76a"/>
    <circle cx="1116" cy="107" r="4" fill="#ffd76a"/>
  </g>

  <g transform="translate(600 68)" filter="url(#shadow)">
    <path d="M-44 30 L-70 -6 L-28 14 L0 -40 L28 14 L70 -6 L44 30 Z" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-42 30 Q0 48 42 30" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-70" cy="-6" r="4" fill="#ffd76a"/>
    <circle cx="0" cy="-40" r="4" fill="#fff0a3"/>
    <circle cx="70" cy="-6" r="4" fill="#ffd76a"/>
  </g>

  <text x="600" y="164" text-anchor="middle" fill="url(#gold)" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="9">GOLDEN DAN</text>
  <text x="600" y="207" text-anchor="middle" fill="#e8c46a" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="5">INFRASTRUCTURE  /  NETWORKING  /  AI  /  AUTOMATION</text>
  <text x="600" y="246" text-anchor="middle" fill="#a98a44" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4">BUILD  ·  SECURE  ·  SCALE</text>

  <line x1="300" y1="269" x2="900" y2="269" stroke="url(#gold)" stroke-opacity=".55"/>
</svg>