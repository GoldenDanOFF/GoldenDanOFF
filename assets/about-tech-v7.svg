<text x="4" y="67" class="t body">Founder &amp; Infrastructure Engineer focused on networking, automation and AI-powered systems.</text>
<text x="4" y="87" class="t body">I build <tspan class="g" font-weight="700">VPNGOLD</tspan>, work with modern network technologies and create automation workflows.</text>
<text x="4" y="107" class="t body">I explore AI to make infrastructure smarter, more resilient and more accessible.</text>
