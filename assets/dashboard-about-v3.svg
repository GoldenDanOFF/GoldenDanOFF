<line x1="28" y1="163" x2="1172" y2="163" stroke="#28323D"/>
<text x="30" y="205" class="t body">Founder &amp; Infrastructure Engineer focused on networking, automation and AI-powered systems.</text>
<text x="30" y="239" class="t body">I build <tspan fill="#F2C14E" font-weight="700">VPNGOLD</tspan>, work with modern network technologies,</text>
<text x="30" y="273" class="t body">create automation workflows and explore AI to make infrastructure smarter,</text>
<text x="30" y="307" class="t body">more resilient and more accessible.</text>
