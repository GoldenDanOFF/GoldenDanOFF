<text x="78" y="336" class="t b">I build VPNGOLD, work with modern network technologies, create</text><text x="78" y="366" class="t b">automation workflows and explore AI to make infrastructure smarter,</text><text x="78" y="396" class="t b">more resilient and more accessible.</text>
